name: BuildItPlus UI smoke tests
on:
  push:
    branches: [launch-prep]
    paths:
      - 'index.html'
      - 'workspace-v2.*'
      - 'server-doctor.js'
      - 'server-tools.js'
      - 'service-worker.js'
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (local static server, no Nitrado writes)
        run: npm test
