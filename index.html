<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Build It!++ DayZ Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: 0,
        maxZoom: 7
    });

    const mapSize = 15360;

    const southWest = map.unproject([0, mapSize], map.getMaxZoom());
    const northEast = map.unproject([mapSize, 0], map.getMaxZoom());

    const bounds = new L.LatLngBounds(southWest, northEast);

    L.tileLayer(
        'https://static.xam.nu/dayz/maps/chernarusplus/1.27/topographic/{z}/{x}/{y}.webp',
        {
            minZoom: 0,
            maxZoom: 7,
            noWrap: true,
            bounds: bounds
        }
    ).addTo(map);

    map.fitBounds(bounds);
    map.setMaxBounds(bounds);
</script>

</body>
</html>
