<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build It!++ DayZ Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #111;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: 0,
        maxZoom: 7,
        zoomSnap: 0.25,
        zoomDelta: 0.5,
        wheelPxPerZoomLevel: 80
    });

    L.tileLayer(
        'https://static.xam.nu/dayz/maps/chernarusplus/1.27/satellite/{z}/{x}/{y}.webp',
        {
            tileSize: 256,
            minZoom: 0,
            maxZoom: 7,
            maxNativeZoom: 7,
            noWrap: true
        }
    ).addTo(map);

    map.setView([-8, 8], 4);
</script>

</body>
</html>
