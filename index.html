<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build It!++ DayZ Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{width:100%;height:100%;margin:0}
body{background:#111;font-family:Arial,Helvetica,sans-serif}
#coords,#status{
 position:absolute;z-index:1000;background:rgba(15,15,15,.9);color:#fff;
 border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 12px;
 pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.35)
}
#coords{left:50%;bottom:16px;transform:translateX(-50%);font-weight:700}
#status{left:50%;top:12px;transform:translateX(-50%);font-size:12px}
.place-label{background:transparent;border:0}
.place-wrap{
 transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
 text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,
 1px 1px 0 #000,0 2px 3px #000;pointer-events:none;user-select:none
}
.cyr{color:#fff;font-weight:800;line-height:1.05;font-size:13px}
.lat{color:#eee;font-weight:700;line-height:1.05;font-size:10px;margin-top:2px}
.type-capital .cyr,.type-city .cyr{font-size:17px}
.type-capital .lat,.type-city .lat{font-size:12px}
.type-town .cyr{font-size:15px}.type-town .lat{font-size:11px}
.type-village .cyr{font-size:13px}
.type-military .cyr,.type-base .cyr,.type-airfield .cyr{color:#ffdada}
.type-water .cyr,.type-lake .cyr,.type-pond .cyr,.type-river .cyr,
.type-bay .cyr,.type-sea .cyr{color:#d9efff;font-style:italic}
@media(max-width:600px){
 #coords{font-size:12px;padding:7px 9px}
 .cyr{font-size:11px}.lat{font-size:9px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Alle Chernarus-locatienamen laden…</div>
<div id="coords">X: ---- &nbsp;&nbsp; Z: ----</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MAP_SIZE=15360;
const XAM_SPACE=256;
const SCALE=MAP_SIZE/XAM_SPACE;

const map=L.map('map',{
  crs:L.CRS.Simple,minZoom:0,maxZoom:7,
  zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:80
});

L.tileLayer(
 'https://static.xam.nu/dayz/maps/chernarusplus/1.27/satellite/{z}/{x}/{y}.webp',
 {tileSize:256,minZoom:0,maxZoom:7,maxNativeZoom:7,noWrap:true}
).addTo(map);

const bounds=L.latLngBounds([[-256,0],[0,256]]);
map.setMaxBounds(bounds.pad(.05));
map.fitBounds(bounds);

const coords=document.getElementById('coords');
const status=document.getElementById('status');

function leafletToGame(ll){
 return {x:Math.round(ll.lng*SCALE),z:Math.round((ll.lat+256)*SCALE)};
}
function gameToLeaflet(x,z){return [z/SCALE-256,x/SCALE]}

map.on('mousemove',e=>{
 if(e.latlng.lng<0||e.latlng.lng>256||e.latlng.lat<-256||e.latlng.lat>0){
   coords.innerHTML='X: ---- &nbsp;&nbsp; Z: ----'; return;
 }
 const p=leafletToGame(e.latlng);
 coords.innerHTML=`X: ${p.x.toLocaleString('nl-NL')} &nbsp;&nbsp; Z: ${p.z.toLocaleString('nl-NL')}`;
});
map.getContainer().addEventListener('mouseleave',()=>{
 coords.innerHTML='X: ---- &nbsp;&nbsp; Z: ----';
});

function cap(s){
 return String(s||'').trim().replace(/(^|[\s\-–—])([A-Za-zА-Яа-яЁё])/g,
   (m,p,c)=>p+c.toLocaleUpperCase());
}
function esc(s){
 return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;')
 .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
}
function hasCyr(s){return /[\u0400-\u04FF]/.test(s||'')}

// Practical Russian/Chernarussian-style transliteration for DayZ labels.
function translit(s){
 const multi=[
  ['Щ','Shch'],['щ','shch'],['Ж','Zh'],['ж','zh'],['Х','Kh'],['х','kh'],
  ['Ц','Ts'],['ц','ts'],['Ч','Ch'],['ч','ch'],['Ш','Sh'],['ш','sh'],
  ['Ю','Yu'],['ю','yu'],['Я','Ya'],['я','ya'],['Ё','Yo'],['ё','yo']
 ];
 for(const [a,b] of multi) s=s.split(a).join(b);
 const m={
  'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g',
  'Д':'D','д':'d','Е':'E','е':'e','З':'Z','з':'z','И':'I','и':'i',
  'Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m',
  'Н':'N','н':'n','О':'O','о':'o','П':'P','п':'p','Р':'R','р':'r',
  'С':'S','с':'s','Т':'T','т':'t','У':'U','у':'u','Ф':'F','ф':'f',
  'Ы':'Y','ы':'y','Э':'E','э':'e','Ь':'','ь':'','Ъ':'','ъ':''
 };
 return cap([...String(s)].map(c=>m[c]??c).join(''));
}

function normType(t){
 return String(t||'location').toLowerCase().replace(/[^a-z0-9_-]/g,'');
}

function addLabel(x,z,original,type,latinOverride=''){
 if(!Number.isFinite(x)||!Number.isFinite(z)||!original) return false;
 const cyr=cap(original);
 const latin=cap(latinOverride || (hasCyr(cyr)?translit(cyr):cyr));
 const typ=normType(type);
 const html=`<div class="place-wrap type-${esc(typ)}">
   <div class="cyr">${esc(cyr)}</div>
   ${latin.toLocaleLowerCase()!==cyr.toLocaleLowerCase()?`<div class="lat">${esc(latin)}</div>`:''}
 </div>`;
 const icon=L.divIcon({className:'place-label',html,iconSize:[0,0],iconAnchor:[0,0]});
 L.marker(gameToLeaflet(x,z),{icon,interactive:false,keyboard:false}).addTo(labels);
 return true;
}

const labels=L.layerGroup().addTo(map);

// Inverse of DZMap's documented GameToMetricZ transform.
function metricZToGame(lon,lat){
 const x=((lon+180)/360)*MAP_SIZE;
 const latRad=lat*Math.PI/180;
 const mercatorY=Math.log(Math.tan(Math.PI/4+latRad/2));
 const z=((mercatorY+Math.PI)/(2*Math.PI))*MAP_SIZE;
 return {x,z};
}

async function loadFromDZMap(){
 const url='https://dzmap.woozymasta.ru/maps/chernarusplus/locations.geojson';
 const r=await fetch(url,{cache:'no-cache'});
 if(!r.ok) throw new Error(`DZMap HTTP ${r.status}`);
 const gj=await r.json();
 if(!Array.isArray(gj.features)) throw new Error('Geen GeoJSON features');
 let n=0;
 for(const f of gj.features){
   if(f?.geometry?.type!=='Point') continue;
   const [lon,lat]=f.geometry.coordinates||[];
   const p=metricZToGame(Number(lon),Number(lat));
   const name=f?.properties?.name||'';
   const type=f?.properties?.type||'location';
   if(addLabel(p.x,p.z,name,type)) n++;
 }
 return n;
}

async function loadFromXAM(){
 const url='https://static.xam.nu/dayz/json/chernarusplus/1.28-2.json';
 const r=await fetch(url,{cache:'no-cache'});
 if(!r.ok) throw new Error(`XAM HTTP ${r.status}`);
 const d=await r.json();
 const locs=d?.markers?.locations;
 if(!Array.isArray(locs)) throw new Error('Geen XAM locations');
 let n=0;
 for(const l of locs){
   if(!Array.isArray(l.p)||l.p.length<2) continue;
   const xamY=Number(l.p[0]), xamX=Number(l.p[1]);
   const x=(xamX*MAP_SIZE)/256;
   const z=((256+xamY)*MAP_SIZE)/256;
   const names=Array.isArray(l.s)?l.s.filter(Boolean):[];
   const original=names.find(hasCyr)||names[0]||'';
   const latin=names.find(v=>!hasCyr(v))||'';
   if(addLabel(x,z,original,l.w||'location',latin)) n++;
 }
 return n;
}

(async()=>{
 let count=0, source='';
 try{
   count=await loadFromDZMap();
   source='DZMap/XAM';
 }catch(e1){
   console.warn('DZMap mislukt, XAM fallback:',e1);
   try{
     count=await loadFromXAM();
     source='XAM';
   }catch(e2){
     console.error('Alle locatiedata mislukt:',e2);
     status.textContent='Locatiedata kon niet worden geladen.';
     status.style.background='rgba(100,20,20,.92)';
     return;
   }
 }
 status.textContent=`${count} benoemde locaties geladen · ${source}`;
 setTimeout(()=>status.style.display='none',3000);
})();
</script>
</body>
</html>
